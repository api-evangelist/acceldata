    date: '2026-08-08'
    change: Domain-Based Alert Visibility
    impact: >-
      Alert, asset and policy visibility became scoped to a user's assigned domains and
      resource groups. Acceldata's own upgrade note states that users with no domain
      assignment "will not see any assets, alerts, or policies — including assets they
      own." An unattended integration can start returning empty result sets with a 200.
