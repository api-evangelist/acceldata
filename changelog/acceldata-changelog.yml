- version: 26.8.0
  date: '2026-08-08'
  breaking: true
  breaking_detail: >-
    Domain-Based Alert Visibility. Alert, asset and policy visibility is now scoped to the
    domains and resource groups a user is authorized for. Acceldata's own note: "Users who
    are not assigned to a domain, or whose domain has no resource groups configured, will
    not see any assets, alerts, or policies — including assets they own." An integration
    reading alerts with a service user that has no domain assignment will silently start
    returning empty results after upgrade.
  additions:
  - Unified Tags — plain string tags and key-value labels consolidated into one key-value model, with a central library under Governance > Tags and a Data Labelers auto-classification tab. Existing tags, labels and API integrations continue to work; data migrates automatically.
  - Multivariate Anomaly Detection in Data Anomaly Policies.
  - Multi-Schedule Support — up to seven independent cron schedules per policy via jobSchedule.cronExpressions.
  - Fivetran HVR 6 pipeline observability (Preview).
  - Google Cloud Pub/Sub as a Visual View source asset.
  - Datasource-level crawler resource configuration.
  - Multiple storage buckets per data plane (fully qualified s3:// or gs:// base paths).
  - Selectable Data Quality dimensions on rules; uniqueness NULL-handling option; Policy ID column.
  sdk:
  - acceldata-sdk-python gains typed Pydantic models for Unified Tags and multi-cron scheduling.
