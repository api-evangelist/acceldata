openapi: 3.2.0
info:
  title: Catalog Data Cadence Rules API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Data Cadence Rules
paths:
  /catalog-server/api/rules/data-cadence/{identifier}:
    get:
      operationId: getDataCadenceRule
      tags:
      - Data Cadence Rules
      summary: Get a data cadence rule by ID or name
      description: 'Returns details of a data cadence rule by its ID or name.

        Optionally specify a version to retrieve a specific version.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW` resource permissions.'
      parameters:
      - name: identifier
        in: path
        description: Policy ID (numeric) or policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific policy version to retrieve (optional; invalid values are ignored)
        schema:
          type: integer
      responses:
        '200':
          description: Data cadence policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCadenceRule.RuleResponse'
        '400':
          description: Bad Request — missing or invalid path parameter
        '404':
          description: 'Policy not found (identifier did not resolve), or

            Data cadence policy with id {ruleId} not found, or

            Data cadence policy not found (service layer)'
  /catalog-server/api/rules/data-cadence/executions/{executionId}/result:
    get:
      operationId: getDataCadenceExecutionResult
      tags:
      - Data Cadence Rules
      summary: Get data cadence execution result
      description: 'This endpoint returns the result for a Data Freshness policy. The policy execution result includes the execution history, details, and its summary.


        **Authorization**: requires `POLICY_VIEW` resource permission (does not require `ASSET_VIEW`).'
      parameters:
      - name: executionId
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policy execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Bad Request — missing or non-numeric executionId
        '404':
          description: Execution not found.
  /catalog-server/api/rules/data-cadence/byAsset/{identifier}:
    get:
      operationId: getDataCadenceByAsset
      tags:
      - Data Cadence Rules
      summary: Get data cadence rule by asset ID
      description: 'Returns the data cadence (Data Freshness) policy associated with a numeric asset ID.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW` resource permissions.


        **Selection**: when multiple data cadence policies exist for the asset, the first matching

        policy is returned (`findAllByAssetIds` + `firstOrNull { type == DATA_CADENCE }`).


        **Response**: `DataCadenceRule.RuleResponse` with required `rule` and optional `details` (rule items).'
      parameters:
      - name: identifier
        in: path
        description: Numeric asset ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Data cadence policy for the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCadenceRule.RuleResponse'
        '400':
          description: Bad Request — missing or non-numeric identifier
        '404':
          description: Data cadence policy for asset {assetId} not found
