openapi: 3.2.0
info:
  title: Catalog Data Drift Rules API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Data Drift Rules
paths:
  /catalog-server/api/rules/data-drift:
    post:
      operationId: createDataDriftRule
      tags:
      - Data Drift Rules
      summary: Create a data drift rule
      description: 'This endpoint allows users to create a Data Drift policy. This request should be sent as an HTTP POST to the specified URL.


        #### Request Body


        - `rule` (object)


        - `enabled` (boolean): Indicates whether the policy is enabled.


        - `name` (string): Name of the policy.


        - `description` (string): Description of the policy.


        - `thresholdLevel` (object)


        - `success` (number): Threshold level for success.


        - `warning` (number): Threshold level for warning.


        - `type` (string): Type of the rule.


        - `backingAsset` (object)


        - `tableAssetId` (number): ID of the table asset.


        - `notificationChannels` (object)


        - `configuredNotificationGroupIds` (array): Array of configured notification group IDs.


        - `notifyOn` (array): Array of notification types to be notified on.


        - `notifyOnSuccess` (boolean): Indicates whether to notify on success.


        - `reNotifyFactor` (number): Re-notification factor.


        - `interval` (string): Interval for the rule.


        - `policyGroups` (array)


        - `id` (number): ID of the policy group.


        - `tags` (array)


        - `name` (string): Name of the tag.


        - `items` (array)


        - `metricType` (string): Type of the metric.


        - `columnName` (string): Name of the column.


        - `driftThreshold` (number): Drift threshold.


        - `executionOrder` (number): Execution order.


        - `businessExplanation` (string): Business explanation.


        - `weightage` (number): Weightage.


        #### Response


        The response will contain details and the added rule:


        - `details` (object)


        - Various details of the added rule.


        - `rule` (object)


        - Details of the created policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_CREATE`.


        **Request body**: `DataDrift.RuleRequest` with:

        - `rule` (`DataDriftRule`): name, description, enabled, interval, thresholdLevel, backingAsset,

        notificationChannels, tags, policyGroups, schedule fields, etc.

        - `items` (`Item[]`): metricType (`DataDriftMetricType`), columnName, driftThreshold, executionOrder,

        weightage, optional value map, optional name.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Data drift rule definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDrift.RuleRequest'
      responses:
        '200':
          description: Created data drift rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.RuleResponse'
        '400':
          description: Bad Request — invalid policy name or validation failure
  /catalog-server/api/rules/data-drift/{identifier}:
    get:
      operationId: getDataDriftRule
      tags:
      - Data Drift Rules
      summary: Get a data drift rule by ID or name
      description: 'Returns a data drift policy by numeric ID or policy name.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.


        **Version selection**: optional `version` query parameter. When `onlyExecutedVersion=true` and

        `version` is omitted, uses the last completed execution''s rule version. Invalid `version` values

        are ignored.'
      parameters:
      - name: identifier
        in: path
        description: Policy ID (numeric) or policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific policy version (optional; invalid values ignored)
        schema:
          type: integer
      - name: onlyExecutedVersion
        in: query
        description: When true and version omitted, return last executed version
        schema:
          type: boolean
      responses:
        '200':
          description: Data drift rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.RuleResponse'
        '400':
          description: Bad Request — missing or invalid path parameter
        '404':
          description: 'Policy not found (identifier did not resolve), or

            Data Drift rule with id {ruleId} not found'
  /catalog-server/api/rules/data-drift/{id}:
    put:
      operationId: updateDataDriftRule
      tags:
      - Data Drift Rules
      summary: Update a data drift rule
      description: 'This endpoint enables users to update various attributes of a Data Drift policy. Users can enable or disable the policy, assign a name, provide a description, and input policy metrics such as completeness, distinct values, average length, minimum and maximum length, case sensitivity (upper, lower, mixed), and standard deviation.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `DataDrift.RuleRequest` (same shape as create). Items must be non-empty.

        Policy name is validated via `isValidNameText()`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated data drift rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDrift.RuleRequest'
      responses:
        '200':
          description: Updated data drift rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.RuleResponse'
        '400':
          description: Bad Request — missing or non-numeric id, invalid name, or validation failure
        '422':
          description: Rules size should not be zero, or entity is not a data drift rule
    delete:
      operationId: deleteDataDriftRule
      tags:
      - Data Drift Rules
      summary: Delete (archive) a data drift rule
      description: 'This endpoint allows users to delete a specific Data Drift policy by its id.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: Optional archival reason
        schema:
          type: string
      responses:
        '204':
          description: Data drift rule archived
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Data Drift rule with id {id} not found, or Data drift policy with id {id} not found (service)
  /catalog-server/api/rules/data-drift/{id}/executions:
    get:
      operationId: getDataDriftExecutions
      tags:
      - Data Drift Rules
      summary: List executions for a data drift rule
      description: 'This endpoint returns a list of all the Data Drift policy executions based on the specified policy id.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: List of data drift executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.ExecutionsResponse'
        '400':
          description: Bad Request — missing or non-numeric id
  /catalog-server/api/rules/data-drift/executions/{id}:
    get:
      operationId: getDataDriftExecutionDetail
      tags:
      - Data Drift Rules
      summary: Get data drift execution details
      description: 'This endpoint provides comprehensive information about a particular execution of a Data Drift policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Data drift execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.Execution'
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Data Drift rule Execution with id {executionId} not found
  /catalog-server/api/rules/data-drift/executions/{id}/result:
    get:
      operationId: getDataDriftExecutionResult
      tags:
      - Data Drift Rules
      summary: Get data drift execution result
      description: 'This endpoint returns the execution result for a Data Drift policy. The execution result includes the execution history, details, and summary.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Execution not found.
  /catalog-server/api/rules/data-drift/byName/{name}:
    put:
      operationId: updateDataDriftByName
      tags:
      - Data Drift Rules
      summary: Update a data drift rule by name
      description: 'This endpoint enables users to update various attributes of a Data Drift policy `byName`. Users can enable or disable the policy, assign a name, provide a description, and input policy metrics such as completeness, distinct values, average length, minimum and maximum length, case sensitivity (upper, lower, mixed), and standard deviation.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `DataDrift.RuleRequest` (same shape as create).'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated data drift rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDrift.RuleRequest'
      responses:
        '200':
          description: Updated data drift rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.RuleResponse'
        '404':
          description: 'Policy with the given name: {name} not found'
        '422':
          description: Rules size should not be zero, or entity is not a data drift rule
    delete:
      operationId: deleteDataDriftByName
      tags:
      - Data Drift Rules
      summary: Delete (archive) a data drift rule by name
      description: 'This endpoint deletes a specific Data Drift policy by its name.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: Optional archival reason
        schema:
          type: string
      responses:
        '204':
          description: Data drift rule archived
        '404':
          description: 'Policy with the given name: {name} not found, or

            Data Drift rule with id {ruleId} not found'
    get:
      operationId: getDataDriftByName
      tags:
      - Data Drift Rules
      summary: Get a data drift rule by name
      description: 'This endpoint makes an HTTP GET request to retrieve Data Drift policy details based on the provided policy name.


        #### Response


        The response of this request is a JSON schema representing the policy details.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific policy version (optional; invalid values ignored)
        schema:
          type: integer
      - name: onlyExecutedVersion
        in: query
        description: When true and version omitted, return last executed version
        schema:
          type: boolean
      responses:
        '200':
          description: Data drift rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.RuleResponse'
        '404':
          description: 'Policy with the given name: {name} not found, or

            Data Drift rule with id {ruleId} not found'
  /catalog-server/api/rules/data-drift/byName/{name}/executions:
    get:
      operationId: getDataDriftExecutionsByName
      tags:
      - Data Drift Rules
      summary: List executions for a data drift rule by name
      description: 'This endpoint returns a list of all Data Drift policy executions by the policy name.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: List of data drift executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDrift.ExecutionsResponse'
        '404':
          description: 'Policy with the given name: {name} not found'
components:
  schemas:
    DataDriftRule:
      type: object
      title: io.ad.catalog.api.model.quality.DataDrift.DataDriftRule
      required:
      - archived
      - backingAsset
      - createdAt
      - enabled
      - includeInQualityScore
      - interval
      - name
      - scheduled
      - thresholdLevel
      - timeZone
      - type
      - updatedAt
      - version
      properties:
        archivalReason:
          type:
          - string
          - 'null'
        archived:
          type: boolean
        autoCreated:
          type: boolean
        autoRetryEnabled:
          type: boolean
        backingAsset:
          $ref: '#/components/schemas/BackingAsset'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        createdBy:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        id:
          type: integer
        includeInQualityScore:
          type: boolean
        interval:
          type: string
        lastUpdatedBy:
          type:
          - string
          - 'null'
        name:
          type: string
        notificationChannels:
          oneOf:
          - $ref: '#/components/schemas/NotificationPayload'
          - type: 'null'
        policyGroups:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PolicyGroup'
        resourceStrategyType:
          type:
          - string
          - 'null'
          enum:
          - INVENTORY
          - CUSTOM
        schedule:
          type:
          - string
          - 'null'
        scheduled:
          type: boolean
        selectedResourceInventory:
          type:
          - string
          - 'null'
        sparkResourceConfig:
          oneOf:
          - $ref: '#/components/schemas/SparkResourceConfig'
          - type: 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RuleTag'
        tenantId:
          type:
          - string
          - 'null'
        thresholdLevel:
          $ref: '#/components/schemas/RuleThresholdConfiguration'
        timeZone:
          type: string
        type:
          type: string
          enum:
          - DATA_QUALITY
          - RECONCILIATION
          - EQUALITY
          - DATA_DRIFT
          - SCHEMA_DRIFT
          - DATA_CADENCE
          - PROFILE_ANOMALY
          - AUTO_ANOMALY
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          type: integer
    JobSpec:
      type: object
      title: io.ad.dataplane.model.spec.JobSpec
      required:
      - artifactFacts
      properties:
        artifactFacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
    LivySparkResourceConfig:
      type: object
      title: io.ad.catalog.api.model.profile.LivySparkResourceConfig
      properties:
        driverCores:
          type: integer
        driverMemory:
          type:
          - string
          - 'null'
        executorCores:
          type: integer
        executorMemory:
          type:
          - string
          - 'null'
        numExecutors:
          type: integer
    AbsoluteThresholdConfig:
      type: object
      title: io.ad.catalog.api.model.quality.AbsoluteThresholdConfig
      required:
      - config
      - type
      properties:
        config:
          $ref: '#/components/schemas/AbsoluteConfigs'
        success:
          type: number
        type:
          type: string
          enum:
          - ANOMALY
          - RELATIVE
          - TIME_BASED
          - ABSOLUTE
        warning:
          type: number
    AboveConfigs:
      type: object
      title: io.ad.catalog.api.model.quality.AboveConfigs
      required:
      - direction
      - success
      properties:
        direction:
          type: string
          enum:
          - ABOVE
          - BELOW
          - RANGE
          - CHANGES_BY
          - DECREASED_BY
          - INCREASED_BY
        success:
          type: number
        warning:
          type: number
    MarkerConfig:
      type: object
      title: io.ad.catalog.api.model.profile.incrementalstrategies.MarkerConfig
      required:
      - type
      properties:
        type:
          type: string
    Marker:
      type: object
      title: io.ad.catalog.api.model.profile.incrementalstrategies.Marker
      required:
      - type
      properties:
        type:
          type: string
    MetaData:
      type: object
      title: io.ad.catalog.api.model.quality.MetaData
      required:
      - count
      - page
      - size
      properties:
        count:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Any:
      type: object
      title: kotlin.Any
    OperationalConfig:
      type: object
      title: io.ad.catalog.api.model.quality.OperationalConfig
      required:
      - lookBack
      properties:
        lookBack:
          $ref: '#/components/schemas/LookBackConfig'
    DataplaneJob:
      type: object
      title: io.ad.catalog.api.model.analysisservice.DataplaneJob
      required:
      - executionStatus
      - jobType
      - startedAt
      properties:
        analysisJobContext:
          oneOf:
          - $ref: '#/components/schemas/AnalysisJobContext'
          - type: 'null'
        analysisServiceJobId:
          type: integer
        analyticsPipelineId:
          type: integer
        assetId:
          type: integer
        assetUid:
          type:
          - string
          - 'null'
        autoRetries:
          type: integer
        autoRetryEnabled:
          type: boolean
        createdAt:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        dataSourceId:
          type:
          - string
          - 'null'
        dataSourceType:
          type:
          - string
          - 'null'
        engineType:
          type:
          - string
          - 'null'
          enum:
          - SPARK
          - JDBC_SQL
          - POD
        errorMessage:
          type:
          - string
          - 'null'
        executionId:
          type: integer
        executionStatus:
          type: string
          enum:
          - WAITING
          - SKIPPED
          - SUBMITTED
          - QUEUED
          - IN_PROGRESS
          - ABORTED
          - FAILED
          - POSTPROCESSING
          - ANOMALY_DETECTION
          - EXECUTION_RESULT
          - SUCCESSFUL
        finishedAt:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        jobSpec:
          oneOf:
          - $ref: '#/components/schemas/JobSpec'
          - type: 'null'
        jobState:
          type:
          - string
          - 'null'
          enum:
          - ACKNOWLEDGED
          - SUBMITTED
          - QUEUED
          - SKIPPED
          - RUNNING
          - READ_DATA
          - REFERENCE_DATA
          - PROFILE_STAGE_1
          - PROFILE_STAGE_2
          - PROFILE_STAGE_3
          - PROFILE_STAGE_4
          - DQ_BATCH_RULES
          - DQ_ROW_RULES
          - DQ_CUSTOM_RULES
          - DQ_SEGMENT
          - DQ_GOOD_RESULT_STORE
          - DQ_BAD_RESULT_STORE
          - VALIDATE
          - PROCESSING
          - PREPARE_RESULT
          - SEND_RESULT
          - SEND_RESULT_FAILED
          - SUCCESSFUL
          - FAILED
          - ABORTED
          - WAITING
          - METRICS_REQUEST_SENT
