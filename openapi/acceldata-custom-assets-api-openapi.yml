openapi: 3.2.0
info:
  title: Catalog Custom Assets API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Custom Assets
paths:
  /catalog-server/api/custom-assets/sql-view/{id}:
    put:
      operationId: updateSqlView
      tags:
      - Custom Assets
      summary: Update a SQL view custom asset
      description: 'This endpoint updates the content of an existing SQL view custom asset, identified by its `ID`. The request body should be in raw format and include the following payload structure:


        #### Request Body


        - **data** (object, required)


        - Represents the request object to update an SQL view.


        - **name** (string)


        - The updated name for the SQL view. If omitted, the existing name is retained.


        - **details** (object, required)


        - Provides details about the SQL view, including the query.


        - **query** (string, required)


        - The query used to construct the SQL view.


        - **description** (string, required)


        - Description of the SQL view query.


        - **schema** (array\[object\], required)


        - Specifies the schema for SQL view columns. Update this field with data from the API response of the `/catalog-server/api/custom-assets/sql-view/sample/result/:requestId` GET request, particularly from `result.schema.fields`.


        - **type** (string, required)


        - Specifies the SQL view column type.


        - **nullable** (boolean, required)


        - Indicates whether the SQL view column is nullable.


        - **name** (string, required)


        - Describes the SQL view column name.'
      parameters:
      - name: id
        in: path
        description: Custom asset ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated SQL view definition and metadata
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSqlViewRequest'
      responses:
        '200':
          description: Updated custom asset wrapped in StandardResponse
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          description: '"Schema cannot be empty" / "Query cannot be empty" / "Description cannot be empty"'
        '404':
          description: '"Custom asset with id {id} not found"'
    delete:
      operationId: deleteSqlView
      tags:
      - Custom Assets
      summary: Delete a SQL view custom asset
      description: This DELETE method is used to delete a SQL View based on its id.
      parameters:
      - name: id
        in: path
        description: Custom asset ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '204':
          description: SQL view deleted successfully
        '404':
          description: '"Custom asset with id {id} not found"'
        '422':
          description: '"Failed to delete the Custom Asset. Most Probably there is a Policy associated with this CustomAsset and hence it can''t be deleted"'
    get:
      operationId: getSqlView
      tags:
      - Custom Assets
      summary: Get a SQL view custom asset
      description: '---


        This endpoint retrieves the custom asset SQL view by providing the asset ID of the custom asset.'
      parameters:
      - name: id
        in: path
        description: Custom asset ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SQL view custom asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAssetResponse'
        '404':
          description: '"Asset with id:{id} does not exist" / "No Custom Asset found for assetId:{id}"'
