openapi: 3.2.0
info:
  title: Catalog Profile Anomaly Rules API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Profile Anomaly Rules
paths:
  /catalog-server/api/rules/profile-anomaly/{identifier}:
    get:
      operationId: getProfileAnomalyRule
      tags:
      - Profile Anomaly Rules
      summary: Get a profile anomaly rule by ID or name
      description: 'Returns a profile anomaly (Data Anomaly) policy by numeric ID or policy name.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.


        **Version**: optional `version` query parameter. Invalid values are ignored (treated as latest).'
      parameters:
      - name: identifier
        in: path
        description: Policy ID (numeric) or policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific policy version (optional; invalid values ignored)
        schema:
          type: integer
      responses:
        '200':
          description: Profile anomaly rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnomalyRule.RuleResponse'
        '404':
          description: 'Policy not found (identifier did not resolve), or

            Profile anomaly policy with id {ruleId} not found, or

            Profile anomaly policy with id {ruleId} and version {version} not found'
  /catalog-server/api/rules/profile-anomaly/{id}:
    put:
      operationId: updateProfileAnomalyRule
      tags:
      - Profile Anomaly Rules
      summary: Update a profile anomaly rule
      description: 'Updates a profile anomaly policy by numeric rule ID.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `ProfileAnomalyRule.RuleRequest`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated profile anomaly rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAnomalyRule.RuleRequest'
      responses:
        '200':
          description: Updated profile anomaly rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnomalyRule.RuleResponse'
        '400':
          description: Bad Request — missing or non-numeric id
  /catalog-server/api/rules/profile-anomaly:
    post:
      operationId: createProfileAnomaly
      tags:
      - Profile Anomaly Rules
      summary: Create a profile anomaly rule
      description: 'Creates a new profile anomaly (Data Anomaly) detection policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_CREATE`.


        **Request body**: `ProfileAnomalyRule.RuleRequest`.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Profile anomaly rule definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAnomalyRule.RuleRequest'
      responses:
        '200':
          description: Created profile anomaly rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnomalyRule.RuleResponse'
        '400':
          description: Bad Request — validation failure
  /catalog-server/api/rules/profile-anomaly/byAsset/{identifier}:
    get:
      operationId: getProfileAnomalyByAsset
      tags:
      - Profile Anomaly Rules
      summary: Get profile anomaly rule by asset ID
      description: 'Returns the profile anomaly policy for a specific asset.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.


        **Note**: path parameter must be a **numeric asset ID** only (not asset name).

        Returns a single policy (`listOneByAsset`), not a list.'
      parameters:
      - name: identifier
        in: path
        description: Numeric asset ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile anomaly rule for the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnomalyRule.RuleResponse'
        '400':
          description: Bad Request — missing or non-numeric identifier
        '404':
          description: 'Either the asset is not present, or the user doesn''t have permissions to perform the operation., or

            Profile anomaly policy for asset {assetId} not found'
  /catalog-server/api/rules/profile-anomaly/executions/{executionId}/result:
    get:
      operationId: getProfileAnomalyExecutionResult
      tags:
      - Profile Anomaly Rules
      summary: Get profile anomaly execution result
      description: 'The `Get Policy Execution Result` endpoint retrieves the result for a Data Anomaly policy execution, including the execution history, details, and summary.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: executionId
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Bad Request — missing or non-numeric executionId
        '404':
          description: Execution not found.
