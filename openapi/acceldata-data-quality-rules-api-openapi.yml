openapi: 3.2.0
info:
  title: Acceldata Data Quality Rules API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Data Quality Rules across 2 of this provider''s published API definitions: acceldata-catalog-api-openapi.json, acceldata-adoc-api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.acceldata.app/v1
  description: Acceldata ADOC API v1
tags:
- name: Data Quality Rules
paths:
  /catalog-server/api/rules/data-quality/{identifier}:
    get:
      operationId: getDataQualityRule
      tags:
      - Data Quality Rules
      summary: Get a data quality rule by ID or name
      description: 'Returns details of a data quality rule by its ID or name, including child rules

        and items. Optionally specify a version or request only the last executed version.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.


        **Version selection**: optional `version` query parameter. When `onlyExecutedVersion=true` and

        `version` is omitted, uses the last completed execution''s rule version. Invalid `version` values

        are ignored.'
      parameters:
      - name: identifier
        in: path
        description: Policy ID (numeric) or policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific policy version (optional; invalid values ignored)
        schema:
          type: integer
      - name: onlyExecutedVersion
        in: query
        description: When true and version omitted, return last executed version
        schema:
          type: boolean
      responses:
        '200':
          description: Data quality rule with children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '404':
          description: 'Policy not found (identifier did not resolve), or

            Data Quality rule with id {ruleId} not found'
  /catalog-server/api/rules/data-quality/{id}/executions:
    post:
      operationId: triggerDataQualityExecution
      tags:
      - Data Quality Rules
      summary: Trigger a data quality rule execution
      description: 'The POST request executes a Data Quality policy by numeric rule ID.


        #### Request Body


        - `markerConfigs` (array): An array of marker configurations containing information about the asset, type, and column names.


        - `assetId` (number): The ID of the asset.


        - `markerConfig` (object, optional): Only required for SELECTIVE profiling. It is a configuration object used to define different types of bounds for policy execution selectively. The `type`attribute determines the structure and required fields of the `markerConfig` object. Below are the possible types and their configurations:


        - Type: `TimestampBasedMarkerConfig`: This configuration is applicable to Kafka asset-based policies. It utilizes the offset associated with the specified timestamp to determine data bounds for policy execution.


        - **type**: `"TimestampBasedMarkerConfig"` (string) - The type of the marker configuration.


        - **format**: (string) - The format of the date values.


        - **initialOffset**: (string) - The initial date offset for the bound.


        - **timeZoneId**: (string) - The time zone ID.


        - Type: `boundFileEvent`: Used to define bounds based on file events and dates.


        - **type**: `"boundFileEvent"` (string) - The type of the marker configuration.


        - **fromDate**: (string) - The start date and time for the bound, in the specified format.


        - **toDate**: (string) - The end date and time for the bound, in the specified format.


        - **timeZoneId**: (string) - The time zone ID.


        - Type: `bound`: Used to define bounds based on an ID range.


        - **type**: `"bound"` (string) - The type of the marker configuration.


        - **idColumnName**: (string) - The name of the column containing ID values.


        - **fromId**: (integer) - The start ID for the bound.


        - **toId**: (integer) - The end ID for the bound.


        - Type: `boundDateTime`: Used to define bounds based on date and time.


        - **type**: `"boundDateTime"` (string) - The type of the marker configuration.


        - **dateColumnName**: (string) - The name of the column containing date and time values.


        - **format**: (string) - The format of the date and time values.


        - **fromDate**: (string) - The start date and time for the bound, in the specified format.


        - **toDate**: (string) - The end date and time for the bound, in the specified format.


        - **timeZoneId**: (string) - The time zone ID.


        - `executionType` (string): The type of execution.


        - `ruleItemSelections` (array): An array of rule item selections.


        - `includeInQualityScore` (boolean): A boolean value to include in the quality score.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_EXECUTE`.


        **Request body**: `PolicyExecutionRequest` — markerConfigs, executionType, ruleItemSelections,

        includeInQualityScore, sparkResourceConfig.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Execution request configuration
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyExecutionRequest'
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Rule not found.
        '422':
          description: Previous execution of rule '{name}' has not completed. Not running the rule.
    get:
      operationId: getDataQualityExecutions
      tags:
      - Data Quality Rules
      summary: List executions for a data quality rule
      description: 'This method retrieves a list of all policy executions for a specific Data Quality policy by its ID.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQuality.ExecutionsResponse'
        '400':
          description: Bad Request — missing or non-numeric id
  /catalog-server/api/rules/data-quality/{id}:
    put:
      operationId: updateDataQualityRule
      tags:
      - Data Quality Rules
      summary: Update a data quality rule
      description: 'This endpoint updates a data quality policy''s attributes in the catalog server by specifying the policy ID in the endpoint URL. The request body should contain a JSON payload with the following parameters:


        #### Request Body Parameters


        1. **rule** (object, required) - Defines the main data quality policy.


        - **enabled** (boolean) - Specifies if the policy should be enabled.


        - **name** (string, required) - Name of the data quality policy.


        - **description** (string) - Description of the data quality policy.


        - **scheduled** (boolean) - Whether the policy is scheduled.


        - **backingAsset** (object) - Configuration for the backing asset.


        - **marker** (object) - Marker configuration for incremental processing.


        - Specify one of the marker types: `IdMarkerConfig`, `DateTimeMarkerConfig`, `DateBasedPartitionMarkerConfig`, `DayMonthYearBasedPartitionMarkerConfig`.


        - **notificationChannels** (object) - Configuration for notification channels.


        - **notifyOnSuccess** (boolean) - Whether to notify on policy success.


        - **additionalPersistedColumns** (array of strings) - Additional persisted columns.


        2. **items** (array of objects, required) - Defines the data quality rule items.


        - **measurementType** (string, required) - Type of measurement for the rule item.


        - **columnName** (string, required) - Column name in the asset where the rule applies.


        - **executionOrder** (integer, required) - Execution order of the rule item.


        - **value** (object) - Additional values or parameters for the rule item.


        - **weightage** (number) - Weightage for the rule.


        - **businessExplanation** (string) - Explanation of the business logic behind the rule.


        - **isWarning** (boolean) - Specifies if the rule is a warning.


        - **labels** (array of objects) - Labels associated with the rule item.


        3. **transformUDFs** (array of objects) - Defines user-defined transformations.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `DataQuality.RuleRequest` (same shape as create).'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated data quality rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRequest'
      responses:
        '200':
          description: Updated data quality rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '400':
          description: Validation failure — DQCheckResponse
    delete:
      operationId: deleteDataQualityRule
      tags:
      - Data Quality Rules
      summary: Delete (archive) a data quality rule
      description: 'This endpoint deletes a specific data quality policy identified by its `id`.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: Optional archival reason
        schema:
          type: string
      responses:
        '204':
          description: Rule deleted successfully
        '404':
          description: Data Quality rule with id {id} not found
  /catalog-server/api/rules/data-quality/{id}/unarchive:
    post:
      operationId: unarchiveDataQualityRule
      tags:
      - Data Quality Rules
      summary: Unarchive a data quality rule
      description: 'When users delete or rename columns in tables associated with a policy, ADOC automatically archives the policy. Archived policies cannot be executed. To reuse the policy, users must unarchive it using the Policy Unarchive feature in ADOC or by using this endpoint (`https://{{HOST}}/catalog-server/api/rules/data-quality/:id/unarchive`).


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unarchived rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnarchiveResponse'
        '404':
          description: Policy not found
  /catalog-server/api/rules/data-quality/{id}/schedule:
    put:
      operationId: setDataQualitySchedule
      tags:
      - Data Quality Rules
      summary: Toggle schedule for a data quality rule
      description: 'Toggling the schedule status of a Data Quality policy involves the action of enabling or disabling the scheduled execution of a particular policy. This toggle functionality allows users to control whether the Data Quality policy runs at predefined intervals or remains inactive.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Note**: this route only applies the `scheduled` boolean from `ScheduleRequest`;

        `cronExpression` and `timeZone` fields are not used here.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Schedule configuration (scheduled boolean required)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '200':
          description: Updated rule with schedule status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '404':
          description: Rule not found.
        '422':
          description: 'Cron schedule is not configured. Cannot execute., or

            Cannot schedule as the rule is already running., or

            Cannot un-schedule as the rule is not scheduled., or

            Cannot schedule a Data Quality rule.'
  /catalog-server/api/rules/data-quality/{id}/items:
    get:
      operationId: getDataQualityItems
      tags:
      - Data Quality Rules
      summary: Get data quality rule items
      description: 'This endpoint returns a list of policy item definitions configured for a specific policy such as Null Values, Asset Data Type, Pattern Match, Schema Match, and Regex Match for an asset based on the policy ID.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of rule items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
  /catalog-server/api/rules/data-quality/executions/{id}:
    get:
      operationId: getDataQualityExecutionDetail
      tags:
      - Data Quality Rules
      summary: Get data quality execution detail
      description: 'This endpoint returns a list of execution details such as start and end time, success and warning threshold, number of evaluations configured, passed and failed, status of execution and the quality score for a specific Data Quality policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Data Quality rule Execution with id {executionId} not found
  /catalog-server/api/rules/data-quality/executions/{id}/result:
    get:
      operationId: getDataQualityExecutionResult
      tags:
      - Data Quality Rules
      summary: Get data quality execution result
      description: 'This endpoint returns the policy execution result for a Data Quality policy. The execution result includes the execution history, execution details, execution summary, quality summary, persistence paths and data violations.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution result with measure outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '404':
          description: Execution not found.
  /catalog-server/api/rules/data-quality:
    post:
      operationId: createDataQualityRule
      tags:
      - Data Quality Rules
      summary: Create a data quality rule
      description: 'This endpoint is used to create a new Data Quality policy.


        #### Request Body Parameters


        1. **rule** (object, required) - Defines the main data quality policy.


        - **enabled** (boolean) - Specifies if the policy should be enabled.


        - **name** (string, required) - Name of the data quality policy.


        - **description** (string) - Description of the data quality policy.


        - **thresholdLevel** (object) - Defines the threshold levels for success and warning.


        - **success** (number) - Threshold level for success.


        - **warning** (number) - Threshold level for warning.


        - **executionTimeoutInMinutes** (number) - Timeout for policy execution in minutes.


        - **analyticsPipelineId** (string) - ID of the analytics pipeline.


        - **type** (string) - Type of the data quality policy.


        - **scheduled** (boolean) - Whether the policy is scheduled.


        - **backingAsset** (object) - Configuration for the backing asset.


        - **marker** (object) - Marker configuration for incremental processing.


        - Specify one of the marker types:


        - **IdMarkerConfig** (object) - Configuration for ID marker.


        - **DateTimeMarkerConfig** (object) - Configuration for date-time marker.


        - **DateBasedPartitionMarkerConfig** (object) - Configuration for date-based partition marker.


        - **DayMonthYearBasedPartitionMarkerConfig** (object) - Configuration for day-month-year-based partition marker.


        - **notificationChannels** (object) - Configuration for notification channels.


        - **configuredNotificationGroupIds** (array of strings) - IDs of configured notification groups.


        - **notifyOn** (array of strings) - Notification types to be triggered.


        - **notifyOnSuccess** (boolean) - Whether to notify on policy success.


        - **reNotifyFactor** (number) - Re-notification factor.


        - **sparkResourceConfig** (object) - Configuration for Spark resources.


        - **labels** (array of strings) - Labels associated with the data quality rule.


        - **policyGroups** (array of strings) - Policy groups associated with the rule.


        - **additionalPersistedColumns** (array of strings) - Additional persisted columns.


        - **segments** (object) - Segments associated with the rule.


        - **filter** (string) - Filter for the rule.


        - **sparkSQLFilterType** (string) - Type of Spark SQL filter.


        - **sparkFilterSelectedColumns** (array of strings) - Selected columns for Spark filter.


        2. **items** (array of objects, required) - Defines the data quality rule items.


        - **measurementType** (string, required) - Type of measurement for the rule item.


        - **columnName** (string, required) - Column name in the asset where the rule applies.


        - **executionOrder** (integer, required) - Execution order of the rule item.


        - **value** (object) - Additional values or parameters for the rule item.


        - **addEmptyCheck** (boolean) - Specifies if empty check should be added.


        3. **transformUDFs** (array of objects) - Defines user-defined transformations.


        ### Response


        The response will contain the details of the created data quality policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_CREATE`.


        **Request body**: `DataQuality.RuleRequest` with:

        - `rule` (`DataQualityRule`): name, description, enabled, thresholdLevel, backingAsset,

        notificationChannels, sparkResourceConfig, labels, policyGroups, segments, filter, etc.

        - `items` (`Item[]`): measurementType, columnName, executionOrder, value, weightage,

        businessExplanation, isWarning, labels.

        - `transformUDFs`, optional `childRules`, optional `engineType`.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Data quality rule definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRequest'
      responses:
        '200':
          description: Created data quality rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '400':
          description: Validation failure — DQCheckResponse or DQCheckResponseComposite
    get:
      operationId: listDataQualityRules
      tags:
      - Data Quality Rules
      summary: List all data quality rules
      description: 'This endpoint retrieves a list of all Data Quality policies configured for a specific tenant.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      - name: ruleStatus
        in: query
        description: Filter by rule status
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of data quality rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponse'
  /catalog-server/api/rules/data-quality/byName/{name}:
    put:
      operationId: updateDataQualityByName
      tags:
      - Data Quality Rules
      summary: Update a data quality rule by name
      description: 'This endpoint allows users to update a Data Quality policy by its `name`.


        #### Request Body Parameters


        1. **rule** (object, required) - Defines the main data quality policy.


        - **enabled** (boolean) - Specifies if the policy should be enabled.


        - **name** (string, required) - Name of the data quality policy.


        - **description** (string) - Description of the data quality policy.


        - **scheduled** (boolean) - Whether the policy is scheduled.


        - **backingAsset** (object) - Configuration for the backing asset.


        - **marker** (object) - Marker configuration for incremental processing.


        - Specify one of the marker types: `IdMarkerConfig`, `DateTimeMarkerConfig`, `DateBasedPartitionMarkerConfig`, `DayMonthYearBasedPartitionMarkerConfig`.


        - **notificationChannels** (object) - Configuration for notification channels.


        - **notifyOnSuccess** (boolean) - Whether to notify on policy success.


        - **additionalPersistedColumns** (array of strings) - Additional persisted columns.


        2. **items** (array of objects, required) - Defines the data quality rule items.


        - **measurementType** (string, required) - Type of measurement for the rule item.


        - **columnName** (string, required) - Column name in the asset where the rule applies.


        - **executionOrder** (integer, required) - Execution order of the rule item.


        - **value** (object) - Additional values or parameters for the rule item.


        - **weightage** (number) - Weightage for the rule.


        - **businessExplanation** (string) - Explanation of the business logic behind the rule.


        - **isWarning** (boolean) - Specifies if the rule is a warning.


        - **labels** (array of objects) - Labels associated with the rule item.


        3. **transformUDFs** (array of objects) - Defines user-defined transformations.


        #### Response Body


        The response will contain the updated details of the data quality policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `DataQuality.RuleRequest` (same shape as create).'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
