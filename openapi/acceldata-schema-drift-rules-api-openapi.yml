openapi: 3.2.0
info:
  title: Catalog Schema Drift Rules API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Schema Drift Rules
paths:
  /catalog-server/api/rules/schema-drift:
    post:
      operationId: createSchemaDriftRule
      tags:
      - Schema Drift Rules
      summary: Create a schema drift rule
      description: 'This endpoint allows user to create a Schema Drift policy.


        #### Request Body


        - `rule` (object)


        - `enabled` (boolean): Specifies if the rule is enabled.


        - `name` (string): The name of the rule.


        - `description` (string): Description of the rule.


        - `type` (string): Type of the rule.


        - `backingAsset` (object)


        - `tableAssetId` (number): ID of the table asset.


        - `policyGroups` (array): Array of policy groups.


        - `notificationChannels` (object)


        - `notifyOn` (array): Array of notifications.


        - `configuredNotificationGroupIds` (array): Array of configured notification group IDs.


        - `notifyOnSuccess` (boolean): Specifies if notification on success is enabled.


        - `severity` (string): Severity level.


        - `reNotifyFactor` (number): Re-notification factor.


        - `alertsEnabled` (boolean): Specifies if alerts are enabled.


        - `items` _(array)_: One or more target assets and their schema drift configurations.


        - `assetId` _(number)_: ID of the asset being monitored.


        - `schemaDriftRuleConfig`_(object)_: Configurations for schema drift detection.


        - `assetAddition`_(boolean)_: Detects if new assets (e.g., columns) are added.


        - `assetDeletion` _(boolean)_: Detects if assets are removed.


        - `dataType` _(boolean)_: Detects changes in data types.


        - `assetRelationChange` _(boolean)_: Detects changes in asset relationships.


        - `assetMetaData` _(boolean)_: Detects changes in asset metadata.


        - `metaDataConfigs` _(array)_: Optional. Configuration of metadata fields to be monitored.


        - `selectedMetaData` _(array)_: Optional. List of selected metadata fields to track.


        #### Response


        The response will contain details and the created rule object with the following fields:


        - `archivalReason` (string): Reason for archival.


        - `archived` (boolean): Specifies if the rule is archived.


        - `assemblyId` (string): ID of the assembly.


        - `autoCreated` (boolean): Specifies if the rule was auto-created.


        - `backingAsset` (object): Details of the backing asset.


        - `createdAt` (string): Date and time of creation.


        - `createdBy` (string): Creator of the rule.


        - `description` (string): Description of the rule.


        - `enabled` (boolean): Specifies if the rule is enabled.


        - `id` (number): ID of the rule.


        - `lastUpdatedBy` (string): Last updated by.


        - `name` (string): Name of the rule.


        - `notificationChannels` (object): Details of notification channels.


        - `policyGroups` (array): Array of policy groups.


        - `sparkResourceConfig` (object): Spark resource configuration.


        - `tags` (array): Array of tags.


        - `tenantId` (string): ID of the tenant.


        - `thresholdLevel` (object): Threshold level details.


        - `type` (string): Type of the rule.


        - `updatedAt` (string): Date and time of last update.


        - `version` (number): Version of the rule.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_CREATE`.


        **Request body**: `SchemaDriftRule.RuleRequest` with top-level `rule` (policy metadata, backingAsset, notificationChannels) and `items` (assetId + schemaDriftRuleConfig per monitored asset). Items are not nested under `rule`.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Schema drift rule definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDriftRule.RuleRequest'
      responses:
        '200':
          description: Created schema drift rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.RuleResponse'
        '400':
          description: Bad Request
  /catalog-server/api/rules/schema-drift/{id}:
    put:
      operationId: updateSchemaDriftRule
      tags:
      - Schema Drift Rules
      summary: Update a schema drift rule
      description: 'This method is used to update a Schema Drift policy by sending a request to the specified endpoint.


        **Request Body**


        The request body should contain a JSON payload with the following fields:


        - `enabled` (boolean): Indicates whether the policy is enabled.


        - `name` (string): The name of the policy.


        - `description` (string): Description of the policy.


        - `type` (string): Type of the policy.


        - `backingAsset` (object): Object containing details about the backing asset, such as `tableAssetId`.


        - `policyGroups` (array): Array of policy groups.


        - `notificationChannels` (object): Object containing notification channel details, such as `notifyOn`, `configuredNotificationGroupIds`, `notifyOnSuccess`, `severity`, `reNotifyFactor`, and `alertsEnabled`.


        The response to this request will be in JSON format with a status code of 200. It will contain details and rule information, including archival status, backing asset details, creation and update information, policy groups, tenant ID, threshold level, and version.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `SchemaDriftRule.RuleRequest` (`rule` + `items`).'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated schema drift rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDriftRule.RuleRequest'
      responses:
        '200':
          description: Updated schema drift rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.RuleResponse'
        '400':
          description: Bad Request — missing or non-numeric id
        '422':
          description: Cannot process a malformed request.
    delete:
      operationId: deleteSchemaDriftRule
      tags:
      - Schema Drift Rules
      summary: Delete (archive) a schema drift rule
      description: 'This endpoint is used to delete a specific Schema Drift policy by its id.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: Optional archival reason
        schema:
          type: string
      responses:
        '204':
          description: Schema drift rule archived
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Schema Drift rule with id {id} not found
    get:
      operationId: getSchemaDriftRule
      tags:
      - Schema Drift Rules
      summary: Get a schema drift rule
      description: 'This endpoint retrieves Schema Drift policy information for a specific policy ID.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific rule version to retrieve
        schema:
          type: integer
      responses:
        '200':
          description: Schema drift rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.RuleResponse'
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Schema Drift rule with id {id} not found
  /catalog-server/api/rules/schema-drift/{id}/executions:
    get:
      operationId: getSchemaDriftExecutions
      tags:
      - Schema Drift Rules
      summary: List executions for a schema drift rule
      description: 'This endpoint retrieves a list of executions run for a specific Schema Drift policy by its `id`.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: List of schema drift executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.ExecutionsResponse'
        '400':
          description: Bad Request — missing or non-numeric id
  /catalog-server/api/rules/schema-drift/executions/{id}/result:
    get:
      operationId: getSchemaDriftExecutionResult
      tags:
      - Schema Drift Rules
      summary: Get schema drift execution result
      description: 'This method returns the result for a Schema Drift policy execution. The execution result includes the execution history, details, and summary.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Execution not found.
  /catalog-server/api/rules/schema-drift/byName/{name}:
    put:
      operationId: updateSchemaDriftByName
      tags:
      - Schema Drift Rules
      summary: Update a schema drift rule by name
      description: 'This endpoint allows users to update a Schema Drift policy by its name.


        #### Request Body


        - `enabled` (boolean): Indicates whether the policy is enabled.


        - `name` (string): The name of the policy.


        - `description` (string): Description of the policy.


        - `type` (string): Type of the policy.


        - `backingAsset` (object): Details of the backing asset.


        - `tableAssetId` (integer): ID of the table asset.


        - `policyGroups` (array): Array of policy groups.


        - `notificationChannels` (object): Notification channels configuration.


        - `notifyOn` (array): Array of notification types to notify on.


        - `configuredNotificationGroupIds` (array): Array of configured notification group IDs.


        - `notifyOnSuccess` (boolean): Indicates whether to notify on success.


        - `severity` (string): Severity level for notifications.


        - `reNotifyFactor` (integer): Re-notification factor.


        - `alertsEnabled` (boolean): Indicates whether alerts are enabled.


        #### Response


        The response will contain the updated details of the policy including:


        - `enabled` (boolean): Indicates whether the policy is enabled.


        - `name` (string): The name of the policy.


        - `description` (string): Description of the policy.


        - `type` (string): Type of the policy.


        - `backingAsset` (object): Details of the backing asset.


        - `tableAssetId` (integer): ID of the table asset.


        - `policyGroups` (array): Array of policy groups.


        - `notificationChannels` (object): Notification channels configuration.


        - `alertsEnabled` (boolean): Indicates whether alerts are enabled.


        - `configuredNotificationGroupIds` (array): Array of configured notification group IDs.


        - `notifyOn` (array): Array of notification types to notify on.


        - `notifyOnSuccess` (boolean): Indicates whether to notify on success.


        - `severity` (string): Severity level for notifications.


        - `details` (object): Additional details of the policy update.


        #### Example Response


        ``` json

        {

        "details": {

        "backingAssetId": 0,

        "continueExecutionOnFailure": true,

        "id": 0,

        "isCompositeRule": true,

        "isSegmented": true,

        "items": [],

        "ruleId": 0,

        "segments": null

        },

        "rule": {

        "archivalReason": null,

        "archived": true,

        "assemblyId": null,

        "autoCreated": true,

        "backingAsset": {

        "customQuery": null,

        "customTableAssetIds": null,

        "id": 0,

        "marker": null,

        "ruleId": 0,

        "tableAlias": null,

        "tableAssetId": 0,

        "tableAssetUid": null

        },

        "createdAt": "",

        "createdBy": "",

        "description": "",

        "enabled": true,

        "id": 0,

        "lastUpdatedBy": "",

        "name": "",

        "notificationChannels": {

        "alertsEnabled": true,

        "configuredNotificationGroupIds": [0],

        "notifyOn": [],

        "notifyOnSuccess": true,

        "reNotifyFactor": 0,

        "severity": "",

        "tags": null

        },

        "policyGroups": [],

        "sparkResourceConfig": null,

        "tags": [],

        "tenantId": "",

        "thresholdLevel": {

        "success": 0,

        "warning": null

        },

        "type": "",

        "updatedAt": "",

        "version": 0

        }

        }


        ```


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `SchemaDriftRule.RuleRequest` (`rule` + `items`). Response: `SchemaDriftRule.RuleResponse` with `rule` and optional `details`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated schema drift rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDriftRule.RuleRequest'
      responses:
        '200':
          description: Updated schema drift rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.RuleResponse'
        '404':
          description: 'Rule with the given name: {name} not found'
        '422':
          description: Cannot process a malformed request.
    delete:
      operationId: deleteSchemaDriftByName
      tags:
      - Schema Drift Rules
      summary: Delete (archive) a schema drift rule by name
      description: '### Delete Policy By Name


        This endpoint is used to delete a specific Schema Drift policy by its name.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: Optional archival reason
        schema:
          type: string
      responses:
        '204':
          description: Schema drift rule archived
        '404':
          description: 'Rule with the given name: {name} not found, or

            Schema Drift rule with id {ruleId} not found'
    get:
      operationId: getSchemaDriftByName
      tags:
      - Schema Drift Rules
      summary: Get a schema drift rule by name
      description: 'This endpoint retrieves Schema Drift policy details by name from the catalog server.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific rule version to retrieve
        schema:
          type: integer
      responses:
        '200':
          description: Schema drift rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.RuleResponse'
        '404':
          description: 'Rule with the given name: {name} not found, or

            Schema Drift rule with id {ruleId} not found'
  /catalog-server/api/rules/schema-drift/byName/{name}/executions:
    get:
      operationId: getSchemaDriftExecutionsByName
      tags:
      - Schema Drift Rules
      summary: List executions for a schema drift rule by name
      description: 'This endpoint retrieves a list of all the executions for a specific Schema Drift policy by its name.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: name
        in: path
        description: Policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: List of schema drift executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDriftRule.ExecutionsResponse'
        '404':
          description: 'Rule with the given name: {name} not found'
components:
  schemas:
    JobSpec:
      type: object
      title: io.ad.dataplane.model.spec.JobSpec
      required:
      - artifactFacts
      properties:
        artifactFacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
    SchemaDriftRule.Rule:
      type: object
      title: SchemaDriftRule.Rule
      required:
      - backingAssetId
      - continueExecutionOnFailure
      - isCompositeRule
      - isSegmented
      - items
      - ruleId
      properties:
        backingAssetId:
          type: integer
        continueExecutionOnFailure:
          type: boolean
        id:
          type: integer
        isCompositeRule:
          type: boolean
        isSegmented:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchemaDriftRule.Item'
        ruleId:
          type: integer
        segments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ShortSegment'
    MarkerConfig:
      type: object
      title: io.ad.catalog.api.model.profile.incrementalstrategies.MarkerConfig
      required:
      - type
      properties:
        type:
          type: string
    LivySparkResourceConfig:
      type: object
      title: io.ad.catalog.api.model.profile.LivySparkResourceConfig
      properties:
        driverCores:
          type: integer
        driverMemory:
          type:
          - string
          - 'null'
        executorCores:
          type: integer
        executorMemory:
          type:
          - string
          - 'null'
        numExecutors:
          type: integer
    AbsoluteThresholdConfig:
      type: object
      title: io.ad.catalog.api.model.quality.AbsoluteThresholdConfig
      required:
      - config
      - type
      properties:
        config:
          $ref: '#/components/schemas/AbsoluteConfigs'
        success:
          type: number
        type:
          type: string
          enum:
          - ANOMALY
          - RELATIVE
          - TIME_BASED
          - ABSOLUTE
        warning:
          type: number
    AboveConfigs:
      type: object
      title: io.ad.catalog.api.model.quality.AboveConfigs
      required:
      - direction
      - success
      properties:
        direction:
          type: string
          enum:
          - ABOVE
          - BELOW
          - RANGE
          - CHANGES_BY
          - DECREASED_BY
          - INCREASED_BY
        success:
          type: number
        warning:
          type: number
    Marker:
      type: object
      title: io.ad.catalog.api.model.profile.incrementalstrategies.Marker
      required:
      - type
      properties:
        type:
          type: string
    Drift:
      type: object
      title: io.ad.catalog.api.model.quality.SchemaDriftRule.Drift
      required:
      - addedNames
      - childAssetTypes
      - deletedNames
      - modifiedNames
      properties:
        addedCount:
          type: integer
        addedNames:
          type: array
          items:
            type: string
        backingAssetId:
          type: integer
        childAssetTypes:
          type: array
          items:
            $ref: '#/components/schemas/AssetType'
        deletedCount:
          type: integer
        deletedNames:
          type: array
          items:
            type: string
        leftSnapshotData:
          oneOf:
          - $ref: '#/components/schemas/SnapshotData'
          - type: 'null'
        modifiedCount:
          type: integer
        modifiedNames:
          type: array
          items:
            type: string
        rightSnapshotData:
          oneOf:
          - $ref: '#/components/schemas/SnapshotData'
          - type: 'null'
    MetaData:
      type: object
      title: io.ad.catalog.api.model.quality.MetaData
      required:
      - count
      - page
      - size
      properties:
        count:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Any:
      type: object
      title: kotlin.Any
    OperationalConfig:
      type: object
      title: io.ad.catalog.api.model.quality.OperationalConfig
      required:
      - lookBack
      properties:
        lookBack:
          $ref: '#/components/schemas/LookBackConfig'
    DataplaneJob:
      type: object
      title: io.ad.catalog.api.model.analysisservice.DataplaneJob
      required:
      - executionStatus
      - jobType
      - startedAt
      properties:
        analysisJobContext:
          oneOf:
          - $ref: '#/components/schemas/AnalysisJobContext'
          - type: 'null'
        analysisServiceJobId:
          type: integer
        analyticsPipelineId:
          type: integer
        assetId:
          type: integer
        assetUid:
          type:
          - string
          - 'null'
        autoRetries:
          type: integer
        autoRetryEnabled:
          type: boolean
        createdAt:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        dataSourceId:
          type:
          - string
          - 'null'
        dataSourceType:
          type:
          - string
          - 'null'
        engineType:
          type:
          - string
