openapi: 3.2.0
info:
  title: Catalog Reference Assets API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Reference Assets
paths:
  /catalog-server/api/assets/{id}/reference-assets/inferredMetadata:
    get:
      operationId: getInferredMetadataByAssetId
      tags:
      - Reference Assets
      summary: Get inferred reference metadata for an asset
      description: 'This endpoint retrieves the inferred metadata for a specific asset.


        **Authorization**: requires `ASSET_VIEW`.


        ### Response


        Returns `StandardResponse>` containing inferred column and schema metadata for reference assets associated with the given asset ID.'
      parameters:
      - name: id
        in: path
        description: Asset ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Inferred column metadata wrapped in StandardResponse
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
