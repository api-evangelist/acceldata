openapi: 3.2.0
info:
  title: Catalog Reconciliation Rules API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Reconciliation Rules
paths:
  /catalog-server/api/rules/reconciliation/{identifier}:
    get:
      operationId: getReconciliationRule
      tags:
      - Reconciliation Rules
      summary: Get a reconciliation rule by ID or name
      description: 'Returns details of a reconciliation rule by its ID or name.

        Optionally specify a version or request only the last executed version.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.


        **Version selection**: optional `version` query parameter. When `onlyExecutedVersion=true` and

        `version` is omitted, uses the last completed execution''s rule version. Invalid `version` values

        are ignored.'
      parameters:
      - name: identifier
        in: path
        description: Policy ID (numeric) or policy name
        required: true
        schema:
          type: string
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Specific policy version (optional; invalid values ignored)
        schema:
          type: integer
      - name: onlyExecutedVersion
        in: query
        description: When true and version omitted, return last executed version
        schema:
          type: boolean
      responses:
        '200':
          description: Reconciliation rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.RuleResponse'
        '404':
          description: 'Policy not found (identifier did not resolve), or

            Reconciliation policy rule with id {ruleId} not found'
        '422':
          description: Entity is not a reconciliation rule.
  /catalog-server/api/rules/reconciliation/{id}/executions:
    post:
      operationId: triggerReconciliationExecution
      tags:
      - Reconciliation Rules
      summary: Trigger a reconciliation rule execution
      description: 'This endpoint triggers execution of a Reconciliation policy by numeric rule ID.


        #### Request Body


        - `markerConfigs` (array of objects): An array of marker configurations containing asset ID, marker type, and other details.


        - `assetId` (number): The ID of the asset.


        - `markerConfig` (object, optional): Only required for SELECTIVE profiling. It is a configuration object used to define different types of bounds for policy execution selectively. The `type`attribute determines the structure and required fields of the `markerConfig` object. Below are the possible types and their configurations:


        - Type: `TimestampBasedMarkerConfig`: This configuration is applicable to Kafka asset-based policies. It utilizes the offset associated with the specified timestamp to determine data bounds for policy execution.


        - **type**: `"TimestampBasedMarkerConfig"` (string) - The type of the marker configuration.


        - **format**: (string) - The format of the date values.


        - **initialOffset**: (string) - The initial date offset for the bound.


        - **timeZoneId**: (string) - The time zone ID.


        - Type: `boundFileEvent`: Used to define bounds based on file events and dates.


        - **type**: `"boundFileEvent"` (string) - The type of the marker configuration.


        - **fromDate**: (string) - The start date and time for the bound, in the specified format.


        - **toDate**: (string) - The end date and time for the bound, in the specified format.


        - **timeZoneId**: (string) - The time zone ID.


        - Type: `bound`: Used to define bounds based on an ID range.


        - **type**: `"bound"` (string) - The type of the marker configuration.


        - **idColumnName**: (string) - The name of the column containing ID values.


        - **fromId**: (integer) - The start ID for the bound.


        - **toId**: (integer) - The end ID for the bound.


        - Type: `boundDateTime`: Used to define bounds based on date and time.


        - **type**: `"boundDateTime"` (string) - The type of the marker configuration.


        - **dateColumnName**: (string) - The name of the column containing date and time values.


        - **format**: (string) - The format of the date and time values.


        - **fromDate**: (string) - The start date and time for the bound, in the specified format.


        - **toDate**: (string) - The end date and time for the bound, in the specified format.


        - **timeZoneId**: (string) - The time zone ID.


        - `executionType` (string): The type of execution.


        - `analyticsPipelineId` (number): The ID of the analytics pipeline.


        - `sparkResourceConfig` (object): Configuration for Spark resources.


        - `yunikorn` (object): Configuration for YuniKorn resource manager.


        - `minExecutors` (number): Minimum number of executors.


        - `maxExecutors` (number): Maximum number of executors.


        - `executorCores` (number): Number of cores per executor.


        - `executorMemory` (string): Memory allocated to each executor.


        - `driverCores` (number): Number of cores for the driver.


        - `driverMemory` (string): Memory allocated to the driver.


        - `additionalConfiguration` (object): Additional configuration details.


        - `ruleItemSelections` (array of numbers): Array of rule item selections.


        - `includeInQualityScore` (boolean): Indicates whether to include in quality score.


        #### Response Body


        - `execution`: Object containing details of the execution including `analysisJob`, `analyticsPipelineId`, `dataPersistenceEnabled`, and more.


        - `items`: Array of items containing execution details such as `executionId`, `finishedAt`, `isError`, `leftAnalyticsPipelineName`, `rightAnalyticsPipelineName`, and more.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_EXECUTE`.


        **Request body**: `PolicyExecutionRequest` — markerConfigs, executionType, analyticsPipelineId,

        sparkResourceConfig, ruleItemSelections, includeInQualityScore.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Execution request configuration
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyExecutionRequest'
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.Execution'
        '400':
          description: Custom SQL / dataplane compatibility validation failure
        '404':
          description: Rule not found., or Execution not found
        '422':
          description: Previous execution of rule '{name}' has not completed. Not running the rule.
    get:
      operationId: getReconciliationExecutions
      tags:
      - Reconciliation Rules
      summary: List executions for a reconciliation rule
      description: 'This endpoint retrieves the executions of a Reconciliation policy based on its id.


        ### Parameters


        - `id` (path, required): The unique identifier of the reconciliation rule.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of reconciliation executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.ExecutionsResponse'
        '400':
          description: Bad Request — missing or non-numeric id
  /catalog-server/api/rules/reconciliation/{id}:
    put:
      operationId: updateReconciliationRule
      tags:
      - Reconciliation Rules
      summary: Update a reconciliation rule
      description: 'This endpoint is used to update an existing Reconciliation policy.


        #### Request Body


        - `rule` (object)


        - `enabled` (boolean, optional): Indicates whether the rule is enabled.


        - `name` (string, optional): The name of the rule.


        - `description` (string, optional): Description of the rule.


        - `thresholdLevel` (object)


        - `success` (number, optional): The success threshold level.


        - `warning` (number, optional): The warning threshold level.


        - `type` (string, optional): The type of the rule.


        - `scheduled` (boolean, optional): Indicates whether the rule is scheduled.


        - `leftBackingAsset` (object): Details of the left backing asset.


        - `tableAssetId` (number, optional): The table asset ID for the left backing asset.


        - `rightBackingAsset` (object): Details of the right backing asset.


        - `tableAssetId` (number, optional): The table asset ID for the right backing asset.


        - `timeSecondsOffset` (number, optional): Time seconds offset.


        - `notificationChannels` (object): Notification channel configuration.


        - `configuredNotificationGroupIds` (array): Configured notification group IDs.


        - `notifyOnSuccess` (boolean): Indicates whether to notify on success.


        - `alertsEnabled` (boolean): Indicates whether alerts are enabled.


        - `reNotifyFactor` (number): Re-notify factor.


        - `labels` (array of objects): Labels for the rule.


        - `policyGroups` (array of objects): Policy groups for the rule.


        - `items` (array of objects)


        - `measurementType` (string, optional): The measurement type.


        - `executionOrder` (number, optional): The execution order.


        - `mappings` (array of objects)


        - `leftColumnName` (string, optional): The left column name for mapping.


        - `operation` (string, optional): The operation for mapping.


        - `rightColumnName` (string, optional): The right column name for mapping.


        - `executionOrder` (number, optional): The execution order for mapping.


        - `useForJoining` (boolean, optional): Indicates whether to use for joining.


        - `ignoreNullValues` (boolean, optional): Indicates whether to ignore null values.


        - `weightage` (number, optional): The weightage for mapping.


        - `businessExplanation` (string, optional): Business explanation for mapping.


        - `isWarning` (boolean, optional): Indicates whether the mapping is a warning.


        - `labels` (array of objects): Labels for the mapping.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `Reconciliation.RuleRequest` (same shape as create).'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Updated reconciliation rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reconciliation.RuleRequest'
      responses:
        '200':
          description: Updated reconciliation rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.RuleResponse'
        '400':
          description: Bad Request — validation failure
    delete:
      operationId: deleteReconciliationRule
      tags:
      - Reconciliation Rules
      summary: Delete (archive) a reconciliation rule
      description: 'This endpoint is used to delete a specific Reconciliation policy by its id.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: Optional archival reason
        schema:
          type: string
      responses:
        '204':
          description: Rule deleted successfully
        '404':
          description: Reconciliation policy  rule with id {id} not found
  /catalog-server/api/rules/reconciliation/{id}/unarchive:
    post:
      operationId: unarchiveReconciliationRule
      tags:
      - Reconciliation Rules
      summary: Unarchive a reconciliation rule
      description: 'This endpoint is used to unarchive a reconciliation policy by its id. When users delete or rename a column of a table, which is associated with a policy, the policy is automatically archived by ADOC, not allowing users to execute it. To reuse the policy, users must unarchive the policy.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unarchived rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnarchiveResponse'
        '404':
          description: 'Policy not found, or

            Reconciliation policy rule with id {ruleId} not found'
  /catalog-server/api/rules/reconciliation/{id}/schedule:
    put:
      operationId: setReconciliationSchedule
      tags:
      - Reconciliation Rules
      summary: Toggle schedule for a reconciliation rule
      description: 'This endpoint toggles the schedule status of a Reconciliation policy to enable or disable the policy. This toggle functionality allows users to control whether the Reconcliation policy runs at predefined intervals or remains inactive.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Note**: this route only applies the `scheduled` boolean from `ScheduleRequest`.'
      parameters:
      - name: id
        in: path
        description: Numeric rule ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Schedule configuration (scheduled boolean required)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '200':
          description: Updated rule with schedule status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.RuleResponse'
        '404':
          description: Rule not found.
        '422':
          description: Cron not configured, schedule state conflict, or wrong rule type
  /catalog-server/api/rules/reconciliation/executions/{id}:
    get:
      operationId: getReconciliationExecutionDetail
      tags:
      - Reconciliation Rules
      summary: Get reconciliation execution detail
      description: 'This endpoint retrieves the details of a Reconciliation policy execution based on the provided execution id.


        **Request Body**

        This request does not require a request body.


        **Response Body**


        - `execution` (object): Details of the reconciliation execution, including analysis job context, analytics pipeline ID, execution status, and other related information.


        - `analysisJob` (object): Information about the analysis job, such as job context, status, and timestamps.


        - `analyticsPipelineId` (number): ID of the analytics pipeline.


        - `dataPersistenceEnabled` (boolean): Indicates if data persistence is enabled for the execution.


        - `executionError` (null): Details of any execution error, if present.


        - `executionMode` (string): Mode of the execution.


        - `executionStatus` (string): Status of the execution.


        - `executionType` (string): Type of the execution.


        - `finishedAt` (string): Timestamp when the execution finished.


        - `id` (number): ID of the execution.


        - `includeInQualityScore` (boolean): Indicates if the execution is included in quality score calculations.


        - `isProtectedResource` (boolean): Indicates if the resource is protected.


        - `jobState` (string): State of the job.


        - `lastHealthUpdateAt` (string): Timestamp of the last health update.


        - `leftMarkerConfig` (object): Configuration for the left marker.


        - `markerConfig` (null): Marker configuration, if available.


        - `parentId` (null): ID of the parent execution, if applicable.


        - `participatingColumns` (array): List of participating columns.


        - `requestId` (string): ID of the request.


        - `resultPersistencePath` (object): Details of the result persistence path.


        - `resultStatus` (string): Status of the result.


        - `ruleId` (number): ID of the rule associated with the execution.


        - `ruleName` (string): Name of the rule.


        - `ruleSelectionEnabled` (boolean): Indicates if rule selection is enabled.


        - `ruleType` (string): Type of the rule.


        - `ruleVersion` (number): Version of the rule.


        - `startedAt` (string): Timestamp when the execution started.


        - `thresholdLevel` (object): Details of the threshold levels for success and warning.


        - `items` (array): List of items related to the execution, including details of left and right analytics pipeline, error information, and timestamps.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.Execution'
        '404':
          description: Reconciliation policy rule Execution with id {executionId} not found
  /catalog-server/api/rules/reconciliation/executions/{id}/result:
    get:
      operationId: getReconciliationExecutionResult
      tags:
      - Reconciliation Rules
      summary: Get reconciliation execution result
      description: 'This endpoint retrieves the Reconciliation policy execution result by the policy id.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: id
        in: path
        description: Numeric execution ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '404':
          description: Rule execution not found.
  /catalog-server/api/rules/reconciliation:
    post:
      operationId: createReconciliationRule
      tags:
      - Reconciliation Rules
      summary: Create a reconciliation rule
      description: 'This endpoint allows users to create a Reconciliation policy.


        #### Request Body


        - `rule` (object)


        - `enabled` (boolean, optional): Whether the rule is enabled.


        - `name` (string, optional): The name of the rule.


        - `description` (string, optional): Description of the rule.


        - `thresholdLevel` (object)


        - `success` (number, optional): Success threshold level.


        - `warning` (number, optional): Warning threshold level.


        - `type` (string, optional): The type of the rule.


        - `scheduled` (boolean, optional): Whether the rule is scheduled.


        - `leftBackingAsset` (object): Details of the left backing asset.


        - `tableAssetId` (number, optional): The table asset ID for the left backing asset.


        - `rightBackingAsset` (object): Details of the right backing asset.


        - `tableAssetId` (number, optional): The table asset ID for the right backing asset.


        - `timeSecondsOffset` (number, optional): Time seconds offset.


        - `notificationChannels` (object): Notification channel configuration.


        - `configuredNotificationGroupIds` (array): Configured notification group IDs.


        - `notifyOnSuccess` (boolean): Whether to notify on success.


        - `alertsEnabled` (boolean): Whether alerts are enabled.


        - `reNotifyFactor` (number): Re-notify factor.


        - `labels` (array of objects): Labels for the rule.


        - `policyGroups` (array of objects): Policy groups for the rule.


        - `items` (array of objects)


        - `measurementType` (string, optional): The measurement type.


        - `executionOrder` (number, optional): The execution order.


        - `mappings` (array of objects)


        - `leftColumnName` (string, optional): The left column name for mapping.


        - `operation` (string, optional): The operation for mapping.


        - `rightColumnName` (string, optional): The right column name for mapping.


        - `executionOrder` (number, optional): The execution order for mapping.


        - `useForJoining` (boolean, optional): Whether to use for joining.


        - `ignoreNullValues` (boolean, optional): Whether to ignore null values.


        - `weightage` (number, optional): The weightage for mapping.


        - `businessExplanation` (string, optional): Business explanation for mapping.


        - `isWarning` (boolean, optional): Whether the mapping is a warning.


        - `labels` (array of objects): Labels for the mapping.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_CREATE`.


        **Request body**: `Reconciliation.RuleRequest` with:

        - `rule` (`ReconciliationRule`): left/right backing assets, thresholdLevel, notificationChannels, etc.

        - `items` (`Item[]`): measurementType, executionOrder

        - `mappings` (`ColumnMapping[]`): leftColumnName, rightColumnName, operation, useForJoining, weightage, etc.

        - optional `analyticsPipelineId`, `cloningDetails`'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Reconciliation rule definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reconciliation.RuleRequest'
      responses:
        '200':
          description: Created reconciliation rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.RuleResponse'
        '400':
          description: Bad Request — invalid policy name or validation failure
    get:
      operationId: listReconciliationRules
      tags:
      - Reconciliation Rules
      summary: List all reconciliation rules
      description: 'This endpoint retrieves policies for reconciliation from the catalog server. The request includes query parameters for pagination, with options to specify the page number, page size, and rule status.


        ### Request Body


        This request does not include a request body.


        ### Response Body


        The response includes a JSON object with a "meta" key containing count, page, and size information, and a "rules" key containing an array of policy objects. Each policy object includes details such as column mappings, execution order, measurement type, and other rule-specific information.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of reconciliation rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation.RulesResponse'
  /catalog-server/api/rules/reconciliation/byName/{name}:
    put:
      operationId: updateReconciliationByName
      tags:
      - Reconciliation Rules
      summary: Update a reconciliation rule by name
      description: 'This endpoint updates a Reconciliation policy by its name. It requires the following parameters in the request body:


        #### Request Body


        - `rule` (object)


        - `enabled` (boolean, optional): Indicates whether the rule is enabled.


        - `name` (string, optional): The name of the rule.


        - `description` (string, optional): Description of the rule.


        - `thresholdLevel` (object)


        - `success` (number, optional): The success threshold level.


