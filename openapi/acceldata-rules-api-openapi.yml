openapi: 3.2.0
info:
  title: Catalog Rules API
  version: '1.0'
  description: API for managing the ADOC data catalog, including assets, asset metadata, tags, labels, sampling, lineage, and watched assets, as well as data reliability policies (data quality, reconciliation, data drift, schema drift, and related rule types) and their executions. Covers discovering and searching assets, retrieving asset configuration and activity, and creating, scheduling, and running policies against catalog assets.
tags:
- name: Rules
paths:
  /catalog-server/api/rules/{id}/schedule:
    put:
      operationId: setRuleSchedule
      tags:
      - Rules
      summary: Toggle schedule for a policy
      description: 'Enables or disables scheduling for any policy type (data quality, reconciliation,

        data drift, schema drift, profile anomaly, etc.) and optionally updates the

        cron expression and time zone. Returns the effective schedule after the update.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_MODIFY`.


        **Request body**: `ScheduleRequest` with required `scheduled`; optional `cronExpression`

        and `timeZone` when updating cron while on or off.


        **Supported types**: DATA_QUALITY, DATA_DRIFT, RECONCILIATION, EQUALITY, PROFILE_ANOMALY,

        AUTO_ANOMALY, DATA_CADENCE, SCHEMA_DRIFT.'
      parameters:
      - name: id
        in: path
        description: Numeric rule / policy ID
        required: true
        schema:
          type: integer
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      requestBody:
        description: Schedule configuration with scheduled flag and optional cron/time zone
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyScheduleResponse'
        '400':
          description: Bad Request — missing or non-numeric id
        '404':
          description: Rule not found.
        '422':
          description: Cannot update schedule for policy type {ruleType}.
  /catalog-server/api/rules/executions:
    get:
      operationId: listRuleExecutions
      tags:
      - Rules
      summary: List policy executions across all rule types
      description: 'This method returns a list of all the policies that were executed. The API returns a paginated response and can be made more specific using query parameters.


        **Authorization**: requires `ASSET_VIEW` and `POLICY_VIEW`.


        **Filters**: `ruleType`, `executionStatus`, and other execution filters are passed as

        direct query parameters (see parameter list). Values map to `RuleExecutionTable`

        filter columns via `listControlOptions`.'
      parameters:
      - name: accessKey
        in: header
        description: API access key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: secretKey
        in: header
        description: API secret key generated from ADOC UI
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Always set to application/json
        required: true
        schema:
          type: string
      - name: ruleType
        in: query
        description: Filter by rule type (e.g. DATA_QUALITY, RECONCILIATION, DATA_DRIFT, DATA_CADENCE, PROFILE_ANOMALY)
        schema:
          type: string
      - name: executionStatus
        in: query
        description: Filter by execution status (e.g. SUCCESSFUL, FAILED, IN_PROGRESS, RUNNING, SUBMITTED)
        schema:
          type: string
      - name: assetIds
        in: query
        description: Comma-separated asset IDs to filter by (resolved to rule IDs server-side)
        schema:
          type: string
      - name: assemblyIds
        in: query
        description: Comma-separated assembly IDs to filter by
        schema:
          type: string
      - name: sourceTypeIds
        in: query
        description: Comma-separated source type IDs to filter by
        schema:
          type: string
      - name: includeSubPolicies
        in: query
        description: Include sub-policy executions when resolving rules from assets (default false)
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number (0-based, default 0)
        schema:
          type: integer
      - name: size
        in: query
        description: Number of items per page (default 25)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort field and direction (e.g., name:asc or createdAt:desc)
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of rule executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionsResponse'
components:
  schemas:
    JobSpec:
      type: object
      title: io.ad.dataplane.model.spec.JobSpec
      required:
      - artifactFacts
      properties:
        artifactFacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
    LivySparkResourceConfig:
      type: object
      title: io.ad.catalog.api.model.profile.LivySparkResourceConfig
      properties:
        driverCores:
          type: integer
        driverMemory:
          type:
          - string
          - 'null'
        executorCores:
          type: integer
        executorMemory:
          type:
          - string
          - 'null'
        numExecutors:
          type: integer
    AbsoluteThresholdConfig:
      type: object
      title: io.ad.catalog.api.model.quality.AbsoluteThresholdConfig
      required:
      - config
      - type
      properties:
        config:
          $ref: '#/components/schemas/AbsoluteConfigs'
        success:
          type: number
        type:
          type: string
          enum:
          - ANOMALY
          - RELATIVE
          - TIME_BASED
          - ABSOLUTE
        warning:
          type: number
    AboveConfigs:
      type: object
      title: io.ad.catalog.api.model.quality.AboveConfigs
      required:
      - direction
      - success
      properties:
        direction:
          type: string
          enum:
          - ABOVE
          - BELOW
          - RANGE
          - CHANGES_BY
          - DECREASED_BY
          - INCREASED_BY
        success:
          type: number
        warning:
          type: number
    MarkerConfig:
      type: object
      title: io.ad.catalog.api.model.profile.incrementalstrategies.MarkerConfig
      required:
      - type
      properties:
        type:
          type: string
    Marker:
      type: object
      title: io.ad.catalog.api.model.profile.incrementalstrategies.Marker
      required:
      - type
      properties:
        type:
          type: string
    MetaData:
      type: object
      title: io.ad.catalog.api.model.quality.MetaData
      required:
      - count
      - page
      - size
      properties:
        count:
          type: integer
        page:
