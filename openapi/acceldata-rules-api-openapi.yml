          - DATA_VIOLATIONS_SAMPLE_DATA
          - DATA_VIOLATIONS_SAMPLE_DATA_S3
          - DATA_VIOLATIONS_SAMPLE_DATA_ADLS
          - DATA_VIOLATIONS_SAMPLE_DATA_GCS
          - DATA_VIOLATIONS_SAMPLE_DATA_HDFS
          - DATA_VIOLATIONS_SAMPLE_DATA_LOCAL
