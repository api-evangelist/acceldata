    DataprocSparkResourceConfig:
      type: object
      title: io.ad.catalog.api.model.profile.DataprocSparkResourceConfig
      properties:
        clusterMasterType:
          type:
          - string
          - 'null'
        clusterWorkerType:
          type:
          - string
          - 'null'
        numMasterNodes:
          type: integer
        numWorkerNodes:
          type: integer
    Artifact:
      type: object
      title: io.ad.dataplane.model.spec.Artifact
      required:
      - name
      - path
      - version
      properties:
        name:
          type: string
        path:
          type: string
        version:
          type: string
    DataplaneJobStatus:
      type: object
      title: io.ad.catalog.api.model.DataplaneJobStatus
      required:
      - id
      - isFinished
      - status
      properties:
        details:
          type:
          - string
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        id:
          type: string
        isFinished:
          type: boolean
        result:
          oneOf:
          - $ref: '#/components/schemas/Any'
          - type: 'null'
        status:
          type: string
    RuleThresholdConfiguration:
      type: object
      title: io.ad.catalog.api.model.quality.RuleThresholdConfiguration
      oneOf:
