      properties:
        cronExpression:
          type:
          - string
          - 'null'
        scheduled:
          type: boolean
        timeZone:
          type:
          - string
          - 'null'
    Any:
      type: object
      title: kotlin.Any
    OperationalConfig:
      type: object
      title: io.ad.catalog.api.model.quality.OperationalConfig
      required:
