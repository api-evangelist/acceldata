- id: oidc
  conforms: false
  evidence:
    checked: /.well-known/openid-configuration on all five Acceldata hosts
    finding: >-
      404 on www.acceldata.io and documentation.acceldata.io; SPA-shell 200s on
      docs.acceldata.io, accounts.acceldata.app and api.acceldata.app. No discovery document.
  note: >-
