domain_standards:
  market: data observability / data governance / metadata management
  note: >-
    The metadata-interchange standards that matter in this market are OpenLineage (pipeline
    lineage events), Egeria/Open Metadata, and the table formats. Acceldata's contracts were
    searched for each. REWARD-ONLY: nothing is asserted that the contract does not declare.
  findings:
  - standard: openlineage
    declared_in_contract: false
    evidence: >-
      String "openlineage" appears in ZERO of the three published specs. Acceldata does
      document a "Databricks Webhook + OpenLineage Setup Runbook"
      (https://docs.acceldata.io/documentation/databricks-webhook---openlineage-setup-runbook)
      and the SDK emits pipeline/run/span/lineage events, but the lineage event shape is not
      published as an OpenLineage-conformant contract.
    consequence: >-
      A team already emitting OpenLineage needs a bespoke connector rather than pointing
      their existing producer at Acceldata.
  - standard: iceberg
    declared_in_contract: true
    evidence: >-
      Literal ICEBERG appears as an enumerated value in the Catalog API contract, so table
      format is a first-class field on catalog assets rather than free text.
    location: openapi/_original/acceldata-catalog-api-openapi.json
  - standard: scim
    declared_in_contract: true
    evidence: see the scim entry above — scimManaged is a REQUIRED property on User and Group.
    consequence: >-
      An enterprise already running SCIM provisioning from Okta/Entra can onboard ADOC
      identities with no bespoke connector, and the contract says so rather than leaving it
      to a sales conversation.
  - standard: focus
    declared_in_contract: false
    evidence: >-
      Acceldata sells cost optimization / FinOps, and the FinOps Foundation FOCUS
      specification is the domain standard for cost-and-usage interchange. No FOCUS column
      names or schema appear in any published spec, and the cost APIs referenced on the API
      introduction page ("Cost and Usage Insights") are not among the three published
      contracts.
    consequence: >-
      The highest-value unclaimed domain standard for this provider. finops/acceldata-finops.yml
      in this repo is an API-Evangelist-authored FOCUS mapping, NOT a provider claim.
