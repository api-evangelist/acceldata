- id: scim
  conforms: true
  level: provisioning-aware consumer, not a SCIM service provider
  evidence:
    contract: openapi/_original/acceldata-administration-api-openapi.json
    locations:
    - components.schemas.User.required includes `scimManaged`
    - components.schemas.Group.required includes `scimManaged`
    - query parameter `scimEnabled` on listGroups and the groups summary operation
    - 'six 403 responses reading "Cannot modify SCIM-managed user or group assignments", "Cannot rename SCIM-managed groups", "Cannot delete SCIM-managed groups"'
    - 'info.description: "SCIM-managed users and groups have restricted edit and delete operations"'
    finding: >-
      Identity is provisioned INTO Acceldata over SCIM from the customer's identity
      provider, and the Administration API contract encodes that fact as a required field
      and as authorization behaviour. No /scim/v2 service-provider endpoint is published,
      so Acceldata is a SCIM relying party rather than a SCIM server.
- id: rfc9457
  conforms: false
  evidence:
    checked: all 157 declared error responses across the three specs
    finding: >-
      Zero operations declare application/problem+json. Three different error envelopes are
      in use instead. See errors/acceldata-problem-types.yml.
- id: google-api-design-guide-errors
  conforms: true
  scope: Tag Services only
  evidence:
    contract: openapi/_original/acceldata-tags-api-openapi.json
    locations:
    - components.schemas.Status carries code/message/details with google.rpc.Code semantics
    - components.schemas.GoogleProtobufAny in the details array
    - 'schema description links https://cloud.google.com/apis/design/errors'
    finding: A gRPC-transcoded surface carrying the canonical google.rpc.Status error model.
- id: pagination
  conforms: true
  evidence:
    contract: all three specs
    styles:
    - 'offset/limit: `first` + `max` (Administration API — 4 and 2 operations)'
    - 'page/size: `page` + `size` (Catalog API 12 operations, Tag Services 1), with `sortBy`'
    finding: >-
      Two DIFFERENT pagination styles ship inside one product. An agent paging the
      Administration API cannot reuse the parameters it learned on the Catalog API.
  docs: https://docs.acceldata.io/api/introduction
- id: idempotency
  conforms: false
  evidence:
    checked: >-
      All 140 published operations; no Idempotency-Key header parameter, no idempotency
      language anywhere in the three specs or in the API reference pages.
    finding: >-
      No idempotency mechanism is published. 45 of the 140 operations are POST/PUT/DELETE,
      so a retried write has no safe replay guarantee.
