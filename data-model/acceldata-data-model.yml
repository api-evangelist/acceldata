identifier_conventions:
  style: opaque integer ids plus string uids
  id_prefixes: none published
  note: >-
    Assets are addressable by BOTH a numeric id and a string uid, and several endpoints
    accept either ("Get Asset by ID or UID"). Policies are addressable by id AND by name —
    every policy family publishes a manage-by-id and a manage-by-name pair. There are no
    typed id prefixes (no `ast_`/`pol_` style), so an id alone does not tell an agent what
    it points at.
